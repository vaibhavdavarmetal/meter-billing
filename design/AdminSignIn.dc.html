<!doctype html>
<html>

<x-dc>

  <style>
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6aa8ff; text-decoration: none; }
    a:hover { color: #8fbfff; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #0a0a0a; color: #ededed; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 24px;">
    <div style="width: 26px; height: 26px; border-radius: 7px; background: #ffffff; display: flex; align-items: center; justify-content: center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
    </div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: -0.011em;">Meter Billing</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-bottom: 80px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.025em;">Owner console</div>
      <div style="font-size: 14px; color: #a1a1a1;">Rent and electricity for Sector 57 and Malibu</div>
    </div>

    <div style="width: 380px; border: 1px solid #262626; border-radius: 12px; background: #111111; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 13px; font-weight: 500; color: #ededed;">Password</label>
        <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #3d3d3d; border-radius: 6px; background: #0d0d0d; box-shadow: 0 0 0 3px rgba(255,255,255,0.04);">
          <span style="flex-grow: 1; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; letter-spacing: 3px; color: #ededed;">••••••••</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 6px; background: #ffffff; color: #0a0a0a; font-size: 14px; font-weight: 500;">Sign in</div>
      <div style="display: flex; align-items: flex-start; gap: 8px; padding-top: 14px; border-top: 1px solid #1f1f1f;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path></svg>
        <div style="font-size: 12px; color: #737373; line-height: 1.5;">This page is only for the owner. Tenants use their own personal link and never see billing.</div>
      </div>
    </div>
  </div>
</div>
